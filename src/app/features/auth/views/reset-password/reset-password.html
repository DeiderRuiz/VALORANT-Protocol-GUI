<div class="fade-in [animation-duration:300ms] space-y-5">
    <h1 class="text-center text-3xl font-bold font-orbitron">VALORANT</h1>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="w-96 flex flex-col space-y-3">
        <app-input-component [form]="resetPasswordForm" controlName="password" 
            tipo="password" placeholder="Contraseña" label="Contraseña"
            [error]="getValidationError('password')"
        ></app-input-component>
        <app-input-component [form]="resetPasswordForm" controlName="password_confirmation" 
            tipo="password" placeholder="Confirmar Contraseña" label="Confirmar Contraseña"
            [error]="getValidationError('password_confirmation')"
        ></app-input-component>
        <app-primary-button 
            texto="Reestablecer Contraseña" 
            [isDisabled]="resetPasswordForm.invalid || loading() === true" 
            tipo="submit"
        ></app-primary-button>
    </form>
</div>
