<div class="fade-in [animation-duration:300ms] space-y-5">
    <h1 class="text-center text-3xl font-bold font-orbitron">VALORANT</h1>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()" class="fade-in [animation-duration:300ms] w-96 flex flex-col space-y-3">
        <app-input-component [form]="forgotPasswordForm" controlName="email" 
            placeholder="Correo Electrónico" label="Correo Electrónico"
            [error]="getValidationError('email')"
        ></app-input-component>
        <app-primary-button 
            texto="Recuperar Contraseña" 
            [isDisabled]="forgotPasswordForm.invalid || loading() === true" 
            tipo="submit"
        ></app-primary-button>
        <a routerLink="/" class="block text-center text-azul-valorant font-bold transition transform hover:scale-110 ease-in-out duration-300 underline">Iniciar Sesión</a>
    </form>
</div>
