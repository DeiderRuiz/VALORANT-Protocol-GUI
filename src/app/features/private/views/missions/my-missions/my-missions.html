<div class="space-y-5 fade-in">
    <app-header titulo="MIS MISIONES"></app-header>
    @if (isLoading()) {
        <app-loader></app-loader>
    }
    @else if(missions().length === 0){
        <p>No has sido asignado a una misión todavía</p>
    } @else{
        <div class="flex flex-col space-y-5 fade-in">
            <app-mission-table [misiones]="missions()" misionURL="/mis-misiones/"></app-mission-table>
            @if (pagination().lastPage > 1) {
                <app-pagination [pagination]="pagination()" (changePage)="onChangePage($event)"></app-pagination>
            }
        </div>
    }
</div>
