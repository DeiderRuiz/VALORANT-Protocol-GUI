<div class="fade-in">
    <app-header titulo="CONFIGURACIONES"></app-header>
    <div class="flex flex-col space-y-6">
        <div class="flex items-center justify-between space-x-4">
            <div class="w-1/3">
                <h3 class="text-xl font-bold">Cambiar Correo Electrónico</h3>
                <p>Actuliza la dirección de correo electrónico de tu cuenta.</p>
            </div>
            <div class="w-1/3">
                <form [formGroup]="emailForm" (ngSubmit)="updateEmail()" class="flex flex-col space-y-3">
                    <app-input-component [form]="emailForm" controlName="email"
                        tipo="email" label="Correo electrónico" placeholder="*Email"
                        [error]="getEmailError('email')"
                    ></app-input-component>
                    <div class="flex items-center justify-end">
                        <app-primary-button [isDisabled]="emailForm.invalid || emailForm.pristine" texto="Cambiar correo electrónico" tipo="submit"></app-primary-button>
                    </div>                
                </form>
            </div>
        </div>
        <hr>
        <div class="flex items-center justify-between space-x-4">
            <div class="w-1/3">
                <h3 class="text-xl font-bold">Cambiar Contraseña</h3>
                <p>Asegúrate de que tu cuenta utilice una contraseña larga y aleatoria para mantener su seguridad.</p>
                <p>Al cambiar tu contraseña, se cerrará tu sesión y deberás iniciar sesión nuevamente.</p>
            </div>
            <div class="w-1/3">
                <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()" class="flex flex-col space-y-3">
                    <app-input-component [form]="passwordForm" controlName="password"
                        tipo="password" label="Contraseña" placeholder="*Contraseña"
                        [error]="getPasswordError('password')"
                    ></app-input-component>
                    <app-input-component [form]="passwordForm" controlName="password_confirmation"
                        tipo="password" label="Confirmar contraseña" placeholder="*Confirmar contraseña"
                        [error]="getPasswordError('password_confirmation')"
                    ></app-input-component>
                    <div class="flex items-center justify-end">
                        <app-primary-button [isDisabled]="passwordForm.invalid" texto="Cambiar contraseña" tipo="submit"></app-primary-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
