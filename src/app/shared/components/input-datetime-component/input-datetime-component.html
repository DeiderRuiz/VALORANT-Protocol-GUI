<div [formGroup]="form">
    <div class="flex items-center justify-start p-1 border-b-2 border-azul-valorant transition transform ease-in-out duration-300 focus:border-b-4 focus:outline-none w-full h-9">
        <span>{{ label }}:</span>
        <input [formControlName]="controlName" type="datetime-local" class="appearance-none bg-transparent placeholder-gris-placeholder block flex items-center justify-start p-1">
    </div>
    @if (form.get(controlName)?.touched && form.get(controlName)?.errors?.['required'] && error === null) {
        <div class="flex items-center justify-start text-rojo-valorant text-sm font-bold space-x-1">
            <iconify-icon icon="mynaui:danger-diamond-solid"></iconify-icon>
            <span>El campo {{ label }} es obligatorio</span>
        </div>
    }
    @if (error !== null) {
        <div class="flex items-center justify-start text-rojo-valorant text-sm font-bold space-x-1">
            <iconify-icon icon="mynaui:danger-diamond-solid"></iconify-icon>
            <span>{{ error }}</span>
        </div>
    }
</div>
