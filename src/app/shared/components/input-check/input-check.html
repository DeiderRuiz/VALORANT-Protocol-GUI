<button type="button" class="flex items-center justify-end capitalize whitespace-nowrap space-x-1 cursor-pointer transition transform ease-in-out duration-200 hover:underline hover:text-rojo-valorant">
    @if (checked) {
        <iconify-icon icon="mynaui:check-diamond-solid"></iconify-icon>
    }@else {
        <iconify-icon icon="mynaui:diamond"></iconify-icon>
    }
    <span>{{ label }}</span>
</button>
