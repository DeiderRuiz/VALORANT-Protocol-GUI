<button (click)="onSelect()" type="button" title="Asignar como lider" class="flex items-center justify-end space-x-2 cursor-pointer transition transform ease-in-out duration-200 hover:underline hover:text-rojo-valorant">
    @if (checked) {
        <iconify-icon icon="icon-park-solid:diamond-three"></iconify-icon>
    }@else {
        <iconify-icon icon="icon-park-outline:diamond-three"></iconify-icon>
    }
    <span>{{ label }}</span>
</button>
